name: Order Booking UI API Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:  # Allows you to trigger the run manually from the GitHub UI
  schedule:
    - cron: '0 2 * * *'  # Runs nightly at 2:00 AM UTC to catch site changes

jobs:
  order-booking-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15 # Failsafe to prevent hanging headed browsers from eating CI minutes

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Python 3.12.0
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.0'
        cache: 'pip' # Speeds up execution by caching Python dependencies

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright OS Dependencies
      run: playwright install-deps

    - name: Install Playwright Chromium Browser
      run: playwright install chromium

    - name: Execute Tests with Virtual Display (Xvfb)
      # xvfb-run creates a virtual screen so headless=False doesn't crash the CI runner
      env:
        APP_EMAIL: ${{ secrets.APP_EMAIL }}
        APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pytest
      continue-on-error: true # Ensures artifacts upload even if a test fails

    - name: Upload Test Report
      uses: actions/upload-artifact@v5
      if: always()
      with:
        name: pytest-html-report
        path: results/report.html
        retention-days: 7
