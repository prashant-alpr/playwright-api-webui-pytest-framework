[pytest]
# Default command line options:
# -v: verbose output
# --tb=short: shorter traceback format for cleaner logs
# -s: disable capturing of stdout/stderr
# --headed: Headed mode
addopts = -v -s --tb=short --headed --html=results/report.html

# Registering custom markers to avoid Pytest warnings
markers =
    smoke: Smoke UI tests
    regression: End-to-end critical business flows
    dependency: Dependent tests

# Logging configuration for debugging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Capture logs for passed and failed tests in the report
log_auto_indent = true

# Specify where Pytest should look for tests
testpaths = tests